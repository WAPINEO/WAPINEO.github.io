<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 유튜버 WAPINEO 공식 페이지</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-sub: #a0a5b5;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
            text-align: center;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 5px;
            font-size: 2rem;
        }

        .sub-text {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 25px;
        }

        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 30px;
            border: 1px solid #2a2d3d;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .links-grid {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .link-btn {
            display: block;
            padding: 16px;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            border: 1px solid #2a2d3d;
            transition: all 0.2s ease;
        }

        .link-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .highlight-btn {
            background-color: var(--accent-color);
            color: #000;
        }

        .highlight-btn:hover {
            background-color: #00cc6a;
            color: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 프로필 섹션 -->
     <img src="https://yt3.googleusercontent.com/gWg6J295tiH2vAwCbK1lcVj601yUtjJneV3obXCz1Iocoeq3s2ls49LDIpwAH3ORczv4VIjw=s160-c-k-c0x00ffffff-no-rj" alt="WAPINEO 프로필" style="width: 120px; height: 120px; border-radius: 50%;">
        <h1>WAPINEO</h1>
        <p class="sub-text">🎮 아케이드 게임 하는 사람 | 구독자 127명! </p>

        <!-- 대표 영상 섹션 -->
        <div class="video-container">
            <!-- 유튜브 동영상 공유 > 퍼가기(Embed) 코드에서 src 부분의 URL만 넣어주세요 -->
            <iframe src="https://www.youtube.com/embed/UsDF6a6dF2A" allowfullscreen></iframe>
        </div>
<!-- 대표 영상 섹션 (자동 최신 영상 불러오기) -->
<div class="video-container">
    <iframe id="latest-video" src="" allowfullscreen></iframe>
</div>

<script>
    // 본인 채널 ID 입력 (UC로 시작하는 고유 채널 ID)
    const channelId = '@WAPINEO'; 
    
    // RSS Feed를 이용해 최신 영상 ID 자동으로 가져오기
    fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`)
        .then(response => response.json())
        .then(data => {
            if (data.items && data.items.length > 0) {
                // 가장 최신 영상의 ID 추출
                const latestVideoLink = data.items[0].link;
                const videoId = latestVideoLink.split('v=')[1];
                
                // iframe src에 최신 영상 주소 적용
                document.getElementById('latest-video').src = `https://www.youtube.com/embed/${videoId}`;
            }
        })
        .catch(error => console.error('영상을 불러오는데 실패했습니다:', error));
</script>
        <!-- 주요 링크 섹션 -->
        <div class="links-grid">
            <a href="https://youtube.com/@WAPINEO" target="_blank" class="link-btn highlight-btn">▶️ 유튜브 채널 바로가기</a>
            <a href="https://chzzk.naver.com/4cf30dc072fd1a799797fc23a5079d0b" target="_blank" class="link-btn">📺 치지직 생방송 보러가기</a>
            <a href="https://ci.me/@wapineo" target="_blank" class="link-btn">📺 씨미 생방송 보러가기</a>
        </div>
    </div>

</body>
</html>
