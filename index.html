<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게임 유튜버 WAPINEO 공식 페이지</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #1a1c23;
            --accent-color: #00ff88;
            --text-color: #ffffff;
            --text-sub: #a0a5b5;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid var(--accent-color);
            margin-bottom: 12px;
            object-fit: cover;
        }

        h1 {
            margin: 5px 0;
            font-size: 1.8rem;
            letter-spacing: -0.5px;
        }

        .sub-text {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-bottom: 25px;
            word-break: keep-all;
        }

        /* 대표 메인 영상 스타일 */
        .video-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 25px;
            border: 1px solid #2a2d3d;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* 영상 갤러리 섹션 */
        .section-title {
            text-align: left;
            font-size: 1.15rem;
            margin-top: 25px;
            margin-bottom: 12px;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 기본(PC) 그리드: 3열 / 모바일: 2열 자동 대응 */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .video-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2a2d3d;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .video-card:active,
        .video-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .video-card img {
            width: 100%;
            aspect-ratio: 16 / 9;
            object-fit: cover;
            background-color: #000;
        }

        .video-title {
            padding: 8px 10px;
            font-size: 0.8rem;
            text-align: left;
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* 주요 링크 버튼 */
        .links-grid {
            display: grid;
            gap: 12px;
            margin-top: 15px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            background-color: var(--card-bg);
            color: var(--text-color);
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.95rem;
            border: 1px solid #2a2d3d;
            transition: all 0.2s ease;
        }

        .link-btn:active,
        .link-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            transform: translateY(-2px);
        }

        .highlight-btn {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .highlight-btn:active,
        .highlight-btn:hover {
            background-color: #00cc6a;
            color: #000;
        }

        /* 📱 모바일화면(폭 600px 이하) 최적화 반응형 스타일 */
        @media (max-width: 600px) {
            .container {
                width: 92%;
                margin: 20px auto;
            }

            .profile-img {
                width: 90px;
                height: 90px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .sub-text {
                font-size: 0.85rem;
                margin-bottom: 20px;
            }

            /* 모바일에서는 2열로 정렬하여 보기 좋게 구성 */
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }

            .video-title {
                padding: 6px 8px;
                font-size: 0.75rem;
            }

            .link-btn {
                padding: 14px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 프로필 섹션 -->
        <img src="https://yt3.googleusercontent.com/gWg6J295tiH2vAwCbK1lcVj601yUtjJneV3obXCz1Iocoeq3s2ls49LDIpwAH3ORczv4VIjw=s160-c-k-c0x00ffffff-no-rj" alt="WAPINEO 프로필" class="profile-img">
        <h1>WAPINEO</h1>
        <p class="sub-text">🎮 아케이드 게임 하는 사람 | 구독자 127명!</p>

        <!-- 최신 메인 영상 플레이어 -->
        <div class="video-container">
            <iframe id="main-video" src="" allowfullscreen></iframe>
        </div>

        <!-- 최근 영상 목록 갤러리 (6개) -->
        <h2 class="section-title">🎬 최근 업로드 영상</h2>
        <div id="video-gallery" class="video-grid"></div>

        <!-- 주요 링크 섹션 -->
        <div class="links-grid">
            <a href="https://youtube.com/@WAPINEO" target="_blank" class="link-btn highlight-btn">▶️ 유튜브 채널 바로가기</a>
            <a href="https://chzzk.naver.com/4cf30dc072fd1a799797fc23a5079d0b" target="_blank" class="link-btn">📺 치지직 생방송 보러가기</a>
            <a href="https://ci.me/@wapineo" target="_blank" class="link-btn">📺 씨미 생방송 보러가기</a>
        </div>
    </div>

    <!-- 유튜브 영상 파싱 스크립트 -->
    <script>
        // 📌 본인의 UC... 채널 ID를 입력하세요.
        const channelId = 'UCQVikVUDGlraFj-Fnr4TG_g';

        function extractVideoId(url) {
            const regExp = /^.*(?:youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[1].length === 11) ? match[1] : null;
        }

        fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`)
            .then(res => res.json())
            .then(async data => {
                if (data.items && data.items.length > 0) {
                    const latestVideoId = extractVideoId(data.items[0].link);
                    if (latestVideoId) {
                        document.getElementById('main-video').src = `https://www.youtube.com/embed/${latestVideoId}?autoplay=0`;
                    }

                    const recentSixItems = data.items.slice(0, 6);
                    const gallery = document.getElementById('video-gallery');

                    for (const item of recentSixItems) {
                        const videoUrl = item.link;
                        const title = item.title;
                        const vId = extractVideoId(videoUrl);

                        let thumbnailUrl = `https://i.ytimg.com/vi/${vId}/hqdefault.jpg`;
                        try {
                            const oembedRes = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(videoUrl)}&format=json`);
                            if (oembedRes.ok) {
                                const oembedData = await oembedRes.json();
                                thumbnailUrl = oembedData.thumbnail_url;
                            }
                        } catch (e) {
                            console.log('oEmbed 실패, 기본 썸네일 사용');
                        }

                        const cardHtml = `
                            <a href="${videoUrl}" target="_blank" class="video-card">
                                <img src="${thumbnailUrl}" alt="${title}" onerror="this.src='https://i.ytimg.com/vi/${vId}/hqdefault.jpg'">
                                <div class="video-title">${title}</div>
                            </a>
                        `;
                        gallery.innerHTML += cardHtml;
                    }
                }
            })
            .catch(err => console.error('영상을 불러오는 중 오류 발생:', err));
    </script>

</body>
</html>
